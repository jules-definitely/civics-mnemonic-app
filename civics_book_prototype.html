  var CATEGORY_ORDER = ["Principles of American Government", "Rights and Responsibilities", "Symbols and Holidays", "The Founding Fathers", "Colonial Period and Independence", "1800s", "System of Government", "Recent American History"];
  var STREAK_KEY = "book_streak_v1";
  var state = { screen: "cover", pages: [], pageIndex: 0, coverOn: false, revealed: false, streak: 0, dismissed: {} };

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildPages() {
    var pages = [];
    CATEGORY_ORDER.forEach(function(cat) {
      var inCat = facts.filter(function(f) { return f.category === cat && !state.dismissed[f.id]; });
      pages = pages.concat(shuffle(inCat));
    });
    return pages;
  }

  function todayISO() { return new Date().toISOString().slice(0,10); }
  function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

  function saveProgress() {
    try {
      localStorage.setItem(STREAK_KEY, JSON.stringify({ last_opened: state._lastOpened, streak: state.streak, dismissed: state.dismissed }));
    } catch (e) { /* localStorage unavailable (e.g. private browsing) — progress just won't persist */ }
  }

  function loadStreak() {
    var data = { last_opened: null, streak: 0, dismissed: {} };
    try {
      var raw = localStorage.getItem(STREAK_KEY);
      if (raw) { data = JSON.parse(raw); }
    } catch (e) { /* localStorage unavailable — start fresh each visit */ }
    state.dismissed = data.dismissed || {};
    var today = todayISO();
    if (data.last_opened === today) {
      state.streak = data.streak;
      state._lastOpened = data.last_opened;
    } else if (data.last_opened && daysBetween(data.last_opened, today) === 1) {
      state.streak = data.streak + 1;
      state._lastOpened = today;
      saveProgress();
    } else {
      state.streak = 1;
      state._lastOpened = today;
      saveProgress();
    }
    render();
  }

  function dismissFact(factId) {
    state.dismissed[factId] = true;
    saveProgress();
  }

  function restoreFact(factId) {
    delete state.dismissed[factId];
    saveProgress();
    render();
  }

  function esc(s) { var d = document.createElement("div"); d.innerText = s; return d.innerHTML; }

      '<path d="M20 44 L20 54 L30 44 Z" fill="'+PAL.navy+'"/>' +
      '<line x1="18" y1="24" x2="46" y2="24" stroke="'+PAL.cream+'" stroke-width="2.5" stroke-linecap="round"/>' +
      '<line x1="18" y1="32" x2="38" y2="32" stroke="'+PAL.cream+'" stroke-width="2.5" stroke-linecap="round"/>', 72); },
    openBook: function() { return svgWrap(
      '<path d="M32 18 C24 14 14 16 10 20 L10 46 C14 42 24 40 32 44 C40 40 50 42 54 46 L54 20 C50 16 40 14 32 18 Z" fill="'+PAL.cream+'" stroke="'+PAL.navy+'" stroke-width="2"/>' +
      '<line x1="32" y1="18" x2="32" y2="44" stroke="'+PAL.navy+'" stroke-width="1.5"/>', 72); },
    bearFlex: function() { return svgWrap(
      '<circle cx="22" cy="32" r="14" fill="'+PAL.rust+'"/>' +
      '<circle cx="12" cy="20" r="5" fill="'+PAL.rust+'"/>' +
      '<circle cx="32" cy="20" r="5" fill="'+PAL.rust+'"/>' +
      '<circle cx="17" cy="30" r="1.5" fill="'+PAL.navy+'"/>' +
      '<circle cx="27" cy="30" r="1.5" fill="'+PAL.navy+'"/>' +
      '<path d="M44 42 Q52 36 50 25 Q58 30 56 40 Q54 48 44 48 Z" fill="'+PAL.mustard+'" stroke="'+PAL.navy+'" stroke-width="1.5"/>', 72); },
    courtSeats: function() { return svgWrap(
      '<rect x="12" y="6" width="12" height="12" rx="2" fill="'+PAL.mustard+'" stroke="'+PAL.navy+'" stroke-width="1"/>' +
      '<rect x="30" y="6" width="12" height="12" rx="2" fill="'+PAL.mustard+'" stroke="'+PAL.navy+'" stroke-width="1"/>' +
      '<rect x="48" y="6" width="12" height="12" rx="2" fill="'+PAL.mustard+'" stroke="'+PAL.navy+'" stroke-width="1"/>' +
      '<rect x="12" y="21" width="12" height="12" rx="2" fill="'+PAL.mustard+'" stroke="'+PAL.navy+'" stroke-width="1"/>' +
      '<rect x="30" y="21" width="12" height="12" rx="2" fill="'+PAL.mustard+'" stroke="'+PAL.navy+'" stroke-width="1"/>' +
      '<rect x="48" y="21" width="12" height="12" rx="2" fill="'+PAL.mustard+'" stroke="'+PAL.navy+'" stroke-width="1"/>' +
      '<rect x="12" y="36" width="12" height="12" rx="2" fill="'+PAL.mustard+'" stroke="'+PAL.navy+'" stroke-width="1"/>' +
      '<rect x="30" y="36" width="12" height="12" rx="2" fill="'+PAL.mustard+'" stroke="'+PAL.navy+'" stroke-width="1"/>' +
      '<rect x="48" y="36" width="12" height="12" rx="2" fill="'+PAL.mustard+'" stroke="'+PAL.navy+'" stroke-width="1"/>' +
      '<path d="M8 56 L32 50 L56 56 Z" fill="'+PAL.navy+'"/>' +
      '<rect x="6" y="56" width="52" height="4" fill="'+PAL.navy+'"/>', 72); },
    courtSeatsFilled: function() { return svgWrap(
      '<rect x="12" y="6" width="12" height="12" rx="2" fill="'+PAL.rust+'"/>' +
      '<rect x="30" y="6" width="12" height="12" rx="2" fill="'+PAL.rust+'"/>' +
      '<rect x="48" y="6" width="12" height="12" rx="2" fill="'+PAL.rust+'"/>' +
      '<rect x="12" y="21" width="12" height="12" rx="2" fill="'+PAL.rust+'"/>' +
      '<rect x="30" y="21" width="12" height="12" rx="2" fill="'+PAL.rust+'"/>' +
      '<rect x="48" y="21" width="12" height="12" rx="2" fill="none" stroke="'+PAL.navy+'" stroke-width="1.5"/>' +
      '<rect x="12" y="36" width="12" height="12" rx="2" fill="none" stroke="'+PAL.navy+'" stroke-width="1.5"/>' +
      '<rect x="30" y="36" width="12" height="12" rx="2" fill="none" stroke="'+PAL.navy+'" stroke-width="1.5"/>' +
      '<rect x="48" y="36" width="12" height="12" rx="2" fill="none" stroke="'+PAL.navy+'" stroke-width="1.5"/>' +
      '<path d="M8 56 L32 50 L56 56 Z" fill="'+PAL.navy+'"/>' +
      '<rect x="6" y="56" width="52" height="4" fill="'+PAL.navy+'"/>', 72); },
    voteBox: function() { return svgWrap(
      '<path d="M14 26 L58 26 L52 56 L20 56 Z" fill="'+PAL.navy+'" stroke="'+PAL.navy+'" stroke-width="2"/>' +
      '<rect x="24" y="18" width="24" height="10" rx="2" fill="'+PAL.cream+'" stroke="'+PAL.navy+'" stroke-width="2"/>' +
      '<line x1="30" y1="10" x2="38" y2="22" stroke="'+PAL.mustard+'" stroke-width="3" stroke-linecap="round"/>', 72); },
    fallingChart: function() { return svgWrap(
      '<line x1="10" y1="14" x2="10" y2="56" stroke="'+PAL.navy+'" stroke-width="2"/>' +
      '<line x1="10" y1="56" x2="58" y2="56" stroke="'+PAL.navy+'" stroke-width="2"/>' +
      '<path d="M14 20 L28 30 L38 26 L54 50" fill="none" stroke="'+PAL.rust+'" stroke-width="3" stroke-linecap="round"/>' +
      '<path d="M46 50 L54 50 L54 42" fill="none" stroke="'+PAL.rust+'" stroke-width="3" stroke-linecap="round"/>', 72); },
    continentAfrica: function() { return svgWrap(
      '<path d="M26 8 C34 6 42 10 44 18 C47 26 46 32 50 38 C53 44 50 50 45 52 C42 54 42 58 38 62 C34 58 32 52 30 46 C27 40 22 36 22 28 C22 20 20 12 26 8 Z" fill="'+PAL.navy+'"/>', 72); },
    mapTerritory: function() { return svgWrap(
      '<path d="M10 20 L54 20 L54 44 L34 44 L34 54 L18 54 L18 40 L10 40 Z" fill="'+PAL.cream+'" stroke="'+PAL.navy+'" stroke-width="2"/>' +
      '<path d="M10 20 L34 20 L34 44 L18 44 L18 40 L10 40 Z" fill="'+PAL.rust+'" opacity="0.6"/>', 72); }
  };

  function iconBadge(name) {
    return '<div style="display:flex;justify-content:center;padding:16px 0 8px;">'+ICONS[name]()+'</div>';
  }

  function techniqueVisual(fact) {
    var colorA = PAL.rust, colorB = PAL.mustard, cream = PAL.cream, navy = PAL.navy;
    if (fact.technique === "numeric_badge") {
      var icon = fact.icon ? iconBadge(fact.icon) : "";
      return icon + '<div style="display:flex;justify-content:center;padding:8px 0 20px;">' +
        '<div class="cvb-badge" style="width:88px;height:88px;background:'+colorA+';color:'+cream+';font-size:24px;">'+esc(fact.badge_number)+'</div></div>';
    }
    if (fact.technique === "contrast_pair") {
      return '<div style="display:flex;gap:2px;margin:16px 0;">' +
        '<div style="flex:1;background:'+navy+';color:'+cream+';padding:16px 10px;text-align:center;border-radius:6px 0 0 6px;">' +
          (fact.contrast.leftIcon ? ICONS[fact.contrast.leftIcon]() : "") +
          '<div class="display" style="font-size:14px;margin-top:6px;">'+esc(fact.contrast.left)+'</div>' +
          '<div style="font-size:12px;margin-top:4px;opacity:0.85;">'+esc(fact.contrast.leftSub)+'</div></div>' +
        '<div style="flex:1;background:'+colorA+';color:'+cream+';padding:16px 10px;text-align:center;border-radius:0 6px 6px 0;">' +
          (fact.contrast.rightIcon ? ICONS[fact.contrast.rightIcon]() : "") +
          '<div class="display" style="font-size:14px;margin-top:6px;">'+esc(fact.contrast.right)+'</div>' +
          '<div style="font-size:12px;margin-top:4px;opacity:0.85;">'+esc(fact.contrast.rightSub)+'</div></div>' +
        '</div>';
    }
    if (fact.technique === "translation_metaphor") {
      return '<div style="text-align:center;padding:20px 0;">' +
        '<div class="display" style="font-size:19px;color:'+navy+';">E Pluribus Unum</div>' +
        '<div style="font-size:20px;margin:6px 0;color:'+colorA+';">&#8595;</div>' +
        '<div class="display" style="font-size:15px;color:'+colorA+';">"Out of many, one"</div>' +
        '<div style="display:flex;justify-content:center;gap:4px;margin-top:12px;">' +
          '<span style="width:8px;height:8px;border-radius:50%;background:'+colorB+';"></span>' +
          '<span style="width:8px;height:8px;border-radius:50%;background:'+colorB+';"></span>' +
          '<span style="width:8px;height:8px;border-radius:50%;background:'+colorB+';"></span>' +
          '<span style="margin:0 6px;">&#8594;</span>' +
          '<span style="width:16px;height:16px;border-radius:50%;background:'+colorA+';"></span>' +
        '</div></div>';
    }
    if (fact.technique === "tune_parody") {
      return '<div style="text-align:center;padding:18px 12px;background:'+colorB+';color:'+navy+';border-radius:8px;">' +
        ICONS.tricornHat() +
        '<div style="font-family:\'Source Sans 3\',sans-serif;font-style:italic;font-size:14px;margin-top:6px;">'+esc(fact.lyric)+'</div></div>';
    }
    if (fact.technique === "icon_set") {
      var setIcons = fact.icons || ["burst", "halfMastFlag", "ribbon"];
      return '<div style="display:flex;justify-content:center;gap:14px;padding:16px 0;">' +
        setIcons.map(function(name) { return ICONS[name] ? ICONS[name]() : ""; }).join("") + '</div>';
    }
    if (fact.technique === "pattern_grouping") {
      var items = fact.pattern_items.map(function(item) {
        var hasPattern = item.indexOf(fact.pattern_highlight) === 0;
        var rest = hasPattern ? item.slice(fact.pattern_highlight.length) : item;
        return '<div style="padding:6px 0;font-size:15px;">' +
          (hasPattern ? '<span style="color:'+colorA+';font-weight:700;">'+esc(fact.pattern_highlight)+'</span>'+esc(rest) : esc(item)) +
          '</div>';
      }).join("");
      return '<div style="padding:16px 0;text-align:center;">'+items+'</div>';
    }
    if (fact.technique === "icon_plain") {
      return fact.icon ? iconBadge(fact.icon) : '<div style="padding:12px 0;"></div>';
    }
    return "";
  }

  function openBook(startCategory) {
    state.pages = buildPages();
    state.pageIndex = 0;
    if (startCategory) {
      var idx = state.pages.findIndex(function(p) { return p.category === startCategory; });
      if (idx >= 0) state.pageIndex = idx;
    }
    state.revealed = false;
    state.screen = state.pages.length ? "reading" : "all_dismissed";
    render();
  }

  function goTo(delta) {
    state.pageIndex = Math.max(0, Math.min(state.pages.length - 1, state.pageIndex + delta));
    state.revealed = false;
    render();
  }

  function render() {
    var root = document.getElementById("cvb-root");

    if (state.screen === "cover") {
      var counts = {};
      facts.forEach(function(f) { counts[f.category] = (counts[f.category]||0) + 1; });
      var dismissedCount = Object.keys(state.dismissed).length;
      var chapters = CATEGORY_ORDER.map(function(cat, i) {
        var activeInCat = facts.filter(function(f) { return f.category === cat && !state.dismissed[f.id]; }).length;
        var label = activeInCat < counts[cat] ? (activeInCat + ' active / ' + counts[cat] + ' total') : (counts[cat] + ' facts');
        return '<div class="cvb-chapter-link" data-cat="'+esc(cat)+'">' +
          '<span>'+(i+1)+'. '+esc(cat)+'</span><span style="color:#5a4d3c;">'+label+'</span></div>';
      }).join("");
      root.innerHTML =
        '<div style="text-align:center;padding:12px 0 20px;">' +
          '<div style="font-size:12px;letter-spacing:0.1em;color:#5a4d3c;">A STUDY BOOK FOR</div>' +
          '<h1 style="font-size:28px;color:#1F3A52;margin:4px 0;">The Civics Facts</h1>' +
          '<div class="cvb-badge" style="background:#D9A441;color:#2b2118;padding:4px 14px;font-size:13px;">'+state.streak+'-day streak</div>' +
        '</div>' +
        '<div style="background:#fff;border-radius:8px;padding:8px 16px;border:1px solid #ddd0b8;">'+chapters+'</div>' +
        '<div style="font-size:12px;color:#5a4d3c;text-align:center;margin-top:6px;">tap a chapter to jump there, or start from the beginning</div>' +
        '<button class="cvb-btn" id="cvb-open" style="width:100%;background:#B3402E;color:#F2E9D8;padding:16px;font-size:16px;margin-top:14px;">Open the book</button>' +
        (dismissedCount ? '<button class="cvb-btn" id="cvb-manage" style="width:100%;background:#fff;color:#5a4d3c;border:1px solid #ddd0b8;padding:10px;font-size:13px;margin-top:8px;">'+dismissedCount+' fact'+(dismissedCount===1?'':'s')+' marked as known &mdash; manage</button>' : '');
      document.getElementById("cvb-open").onclick = function() { openBook(); };
      Array.prototype.forEach.call(document.querySelectorAll(".cvb-chapter-link"), function(el) {
        el.onclick = function() { openBook(el.getAttribute("data-cat")); };
      });
      var manageBtn = document.getElementById("cvb-manage");
      if (manageBtn) manageBtn.onclick = function() { state.screen = "manage"; render(); };
      return;
    }

    if (state.screen === "all_dismissed") {
      root.innerHTML =
        '<div style="text-align:center;padding:32px 0;">' +
        '<h2 style="color:#1F3A52;">You know every fact in this chapter</h2>' +
        '<p style="font-size:14px;color:#5a4d3c;">Restore some from Manage if you want to review them again.</p>' +
        '<button class="cvb-btn" id="cvb-home" style="background:#1F3A52;color:#F2E9D8;margin-top:12px;">Back to overview</button></div>';
      document.getElementById("cvb-home").onclick = function() { state.screen = "cover"; render(); };
      return;
    }

    if (state.screen === "manage") {
      var byCat = {};
      Object.keys(state.dismissed).forEach(function(id) {
        var f = facts.find(function(x) { return x.id === id; });
        if (!f) return;
        (byCat[f.category] = byCat[f.category] || []).push(f);
      });
      var rows = "";
      CATEGORY_ORDER.forEach(function(cat) {
        if (!byCat[cat]) return;
        rows += '<div style="font-size:12px;letter-spacing:0.06em;color:#B3402E;margin:14px 0 4px;">'+esc(cat.toUpperCase())+'</div>';
        byCat[cat].forEach(function(f) {
          rows += '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eee2c8;">' +
            '<span style="font-size:13px;">'+esc(f.statement)+'</span>' +
            '<button class="cvb-btn cvb-restore" data-id="'+esc(f.id)+'" style="background:#eee;color:#2b2118;font-size:11px;padding:6px 10px;white-space:nowrap;">put back</button></div>';
        });
      });
      if (!rows) rows = '<p style="font-size:14px;color:#5a4d3c;text-align:center;">Nothing marked as known yet.</p>';
      root.innerHTML =
        '<h2 style="color:#1F3A52;font-size:20px;">Facts you\'ve marked as known</h2>' +
        '<div style="background:#fff;border-radius:8px;padding:8px 16px;border:1px solid #ddd0b8;">'+rows+'</div>' +
        '<button class="cvb-btn" id="cvb-home" style="width:100%;background:#1F3A52;color:#F2E9D8;margin-top:14px;">Back to overview</button>';
      document.getElementById("cvb-home").onclick = function() { state.screen = "cover"; render(); };
      Array.prototype.forEach.call(document.querySelectorAll(".cvb-restore"), function(btn) {
        btn.onclick = function() { restoreFact(btn.getAttribute("data-id")); };
      });
      return;
    }

    var fact = state.pages[state.pageIndex];
    var isNewChapter = state.pageIndex === 0 || state.pages[state.pageIndex-1].category !== fact.category;
    var html = "";
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">' +
      '<select id="cvb-jump" style="font-size:12px;border:1px solid #ddd0b8;border-radius:4px;background:#fff;color:#5a4d3c;padding:2px 4px;">' +
      CATEGORY_ORDER.map(function(c){ return '<option value="'+esc(c)+'"'+(c===fact.category?' selected':'')+'>'+esc(c)+'</option>'; }).join("") +
      '</select>' +
      '<span style="font-size:12px;color:#5a4d3c;">page '+(state.pageIndex+1)+' of '+state.pages.length+'</span></div>';
    if (isNewChapter) {
      html += '<div style="text-align:center;font-size:12px;letter-spacing:0.08em;color:#B3402E;margin-bottom:8px;">'+esc(fact.category.toUpperCase())+'</div>';
    }
    html += '<div style="display:flex;justify-content:flex-end;margin-bottom:8px;">' +
      '<label class="cvb-toggle" id="cvb-cover-toggle">' +
        '<div class="cvb-switch'+(state.coverOn ? ' on' : '')+'"><div class="cvb-switch-knob"></div></div>' +
        'cover &amp; test myself</label></div>';

    html += '<div class="cvb-page" id="cvb-card" style="background:#fff;border-radius:10px;padding:24px;border:1px solid #ddd0b8;min-height:220px;">';
    html += techniqueVisual(fact);
    html += '<div style="border-top:1px solid #eee2c8;margin-top:8px;padding-top:14px;text-align:center;">';
    if (state.coverOn && !state.revealed) {
      html += '<div style="font-size:15px;color:#2b2118;margin-bottom:14px;">'+esc(fact.q)+'</div>';
      html += '<button class="cvb-btn" id="cvb-reveal" style="background:#D9A441;color:#2b2118;">Tap to reveal</button>';
    } else {
      html += '<div class="display" style="font-size:17px;color:#2b2118;">'+esc(fact.statement)+'</div>';
      if (fact.answer && fact.answer !== fact.statement) {
        html += '<div style="font-size:13px;color:#5a4d3c;margin-top:6px;">say: <span style="color:#B3402E;font-weight:600;">'+esc(fact.answer)+'</span></div>';
      }
    }
    html += '</div></div>';

    html += '<div style="display:flex;gap:8px;margin-top:16px;">' +
      '<button class="cvb-btn" id="cvb-prev" style="flex:1;background:#eee;color:#2b2118;" '+(state.pageIndex===0?'disabled':'')+'>&#8592; Previous</button>' +
      '<button class="cvb-btn" id="cvb-cover" style="background:#1F3A52;color:#F2E9D8;">Home</button>' +
      '<button class="cvb-btn" id="cvb-next" style="flex:1;background:#B3402E;color:#F2E9D8;" '+(state.pageIndex===state.pages.length-1?'disabled':'')+'>Next &#8594;</button>' +
      '</div>' +
      '<button class="cvb-btn" id="cvb-dismiss" style="width:100%;background:none;color:#5a4d3c;font-size:12px;margin-top:8px;text-decoration:underline;">&#10003; I know this \u2014 remove from rotation</button>';

    root.innerHTML = html;
    document.getElementById("cvb-prev").onclick = function(e) { e.stopPropagation(); goTo(-1); };
    document.getElementById("cvb-next").onclick = function(e) { e.stopPropagation(); goTo(1); };
    document.getElementById("cvb-cover").onclick = function(e) { e.stopPropagation(); state.screen = "cover"; render(); };
    document.getElementById("cvb-cover-toggle").onclick = function(e) { e.stopPropagation(); state.coverOn = !state.coverOn; state.revealed = false; render(); };
    document.getElementById("cvb-jump").onchange = function(e) { openBook(e.target.value); };
    document.getElementById("cvb-dismiss").onclick = function(e) {
      e.stopPropagation();
      dismissFact(fact.id);
      if (state.pageIndex < state.pages.length - 1) { goTo(1); } else { state.screen = "cover"; render(); }
    };
    var revealBtn = document.getElementById("cvb-reveal");
    if (revealBtn) revealBtn.onclick = function(e) { e.stopPropagation(); state.revealed = true; render(); };
    document.getElementById("cvb-card").onclick = function() {
      if (state.coverOn && !state.revealed) { state.revealed = true; render(); }
      else if (state.pageIndex < state.pages.length - 1) { goTo(1); }
    };
  }

  loadStreak();
})();
</script>
